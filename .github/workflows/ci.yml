name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @abraxas/schema build
      - run: pnpm --filter @abraxas/pipeline test
      - run: pnpm --filter @abraxas/schema test
      - run: pnpm pipeline:fixtures
        env:
          VULN_SCAN_ENABLED: "false"
      - run: pnpm --filter @abraxas/web test
      - run: pnpm --filter @abraxas/web build
        env:
          VULN_SCAN_ENABLED: "false"
